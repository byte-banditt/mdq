[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdq"
version = "0.1.0"
description = "Daily NSE market data pipeline with data-quality checks"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "PyYAML", "openpyxl", "yfinance", "scipy", "matplotlib", "python-pptx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
mdq = "mdq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "index_lab"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
mdq = ["schema.sql"]
